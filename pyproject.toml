[project]
name = "coin-audit-bot"
version = "6.0.0"
description = "Read-only Binance Spot coin-audit research bot: validated strategy library, chart patterns, market regime, ML meta-labeler."
requires-python = ">=3.11,<3.15"
readme = "README.md"
license = {text = "MIT"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["audit", "tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning",
                  "ignore::RuntimeWarning"]
timeout = 900

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["freqtrade/user_data/strategies", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "B905", "E741", "B023"]
